name: Map Gala portrait to Galahad asset

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-gala-alias:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tracker
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add Gala portrait alias
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('assets/js/tracker-app.js')
          source = path.read_text(encoding='utf-8')
          old = "const PORTRAIT_ALIASES={'taichi':'taichi-agumon','yamato':'yamato-gabumon'};"
          new = "const PORTRAIT_ALIASES={'taichi':'taichi-agumon','yamato':'yamato-gabumon','gala':'galahad'};"

          if old not in source:
              raise SystemExit('Expected PORTRAIT_ALIASES declaration was not found.')

          updated = source.replace(old, new, 1)

          if updated == source:
              raise SystemExit('No alias changes were applied.')

          path.write_text(updated, encoding='utf-8')
          print('Added Gala portrait alias.')
          PY

      - name: Commit Gala alias
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/tracker-app.js

          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Map Gala portrait to Galahad asset"
            git push
          fi
