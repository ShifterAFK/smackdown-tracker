name: Sync AFK Journey portraits

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tracker
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download and sync portraits
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .stargazer portraits
          curl -fsSL https://afkstargazer.com/ -o .stargazer/index.html

          mapfile -t JS_FILES < <(grep -oE '/assets/[A-Za-z0-9._-]+\.js' .stargazer/index.html | sort -u || true)
          if [ "${#JS_FILES[@]}" -eq 0 ]; then
            echo "No JavaScript bundles found."
            exit 1
          fi

          for js in "${JS_FILES[@]}"; do
            curl -fsSL "https://afkstargazer.com$js" -o ".stargazer/$(basename "$js")"
          done

          grep -hoE '/assets/[A-Za-z0-9._-]+\.webp' .stargazer/*.js .stargazer/index.html |
            sort -u > .stargazer/assets.txt

          if [ ! -s .stargazer/assets.txt ]; then
            echo "No WebP assets found."
            exit 1
          fi

          cat > hero_ids.txt <<'EOF'
          alna
          alsa
          antandra
          arden
          aster
          atalanta
          athalia
          aurora
          baden
          baelran
          berial
          bonnie
          brutus
          bryon
          callan
          carolina
          cassadee
          cecia
          chippy
          contess
          cryonaia
          cyran
          daimon
          damian
          dionel
          dunlingr
          eironn
          elijah-lailah
          eryndor
          estrilda
          evie
          faramor
          fay
          florabelle
          frieren
          galahad
          gerda
          gervan
          granny-dahnie
          gunnar
          gwyneth
          hammie
          harak
          hepler
          hewynn
          himmel
          hodgkin
          hugin
          igor
          indris
          isabella
          kafra
          kazim
          koko
          kordan
          korin
          kruger
          kulu
          laios
          lenya
          lily-may
          lorsan
          lucca
          lucius
          lucy
          ludovic
          lumont
          lyca
          marcille
          marilee
          mehira
          mikola
          mirael
          nara
          natsu
          nazrik
          nerion
          niru
          odie
          orion
          pandora
          pang
          parisa
          perseus
          phraesto
          pippa
          ravion
          reinier
          rhys
          rowan
          saida
          salazer
          satrana
          scarlita
          senea
          seth
          shadewing
          shakir
          shemira
          silven
          silvina
          sinbad
          smokey-meerky
          solise
          sonja
          soren
          sylphira
          taichi-agumon
          talene
          tasi
          temesia
          thador
          thoran
          tilaya
          ulmus
          vala
          valen
          valka
          velara
          viperian
          walker
          yamato-gabumon
          zandrok
          zanie
          zorya
          EOF

          downloaded=0

          while IFS= read -r asset; do
            filename=$(basename "$asset")
            stem="${filename%.webp}"

            clean=$(printf '%s' "$stem" | sed -E \
              -e 's/-(skin[0-9]+)-[A-Za-z0-9_-]{8}$/-\1/' \
              -e 't' \
              -e 's/-[A-Za-z0-9_-]{8}$//')

            base="$clean"
            if [[ "$clean" =~ -skin[0-9]+$ ]]; then
              base="${clean%-*}"
            fi

            if grep -Fxq "$base" hero_ids.txt; then
              curl -fsSL "https://afkstargazer.com$asset" -o "portraits/${clean}.webp"
              downloaded=$((downloaded + 1))
            fi
          done < .stargazer/assets.txt

          echo "Downloaded $downloaded matching portrait assets."

          removed=0
          shopt -s nullglob
          for file in portraits/*.webp; do
            name="$(basename "$file" .webp)"
            base="$name"
            if [[ "$name" =~ -skin[0-9]+$ ]]; then
              base="${name%-*}"
            fi

            if ! grep -Fxq "$base" hero_ids.txt; then
              rm -f "$file"
              removed=$((removed + 1))
            fi
          done

          echo "Removed $removed non-hero assets."

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A portraits

          if git diff --staged --quiet; then
            echo "No portrait changes."
          else
            git commit -m "Strip exactly 8-character portrait hashes"
            git push
          fi

      - name: Clean temporary files
        if: always()
        shell: bash
        run: rm -rf .stargazer hero_ids.txt
