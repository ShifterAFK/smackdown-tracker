name: Sync AFK Journey portraits

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tracker
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download and extract Stargazer assets
        run: |
          mkdir -p .stargazer
          curl -fsSL https://afkstargazer.com/ -o .stargazer/index.html

          JS_FILES=$(grep -oE '/assets/[A-Za-z0-9._-]+\.js' .stargazer/index.html | sort -u || true)
          if [ -z "$JS_FILES" ]; then
            echo "No JavaScript bundles found."
            exit 1
          fi

          for js in $JS_FILES; do
            curl -fsSL "https://afkstargazer.com$js" -o ".stargazer/$(basename "$js")"
          done

          grep -hoE '/assets/[A-Za-z0-9._-]+\.webp' .stargazer/*.js .stargazer/index.html |
            sort -u > .stargazer/assets.txt

          if [ ! -s .stargazer/assets.txt ]; then
            echo "No WebP assets found."
            exit 1
          fi

          mkdir -p portraits

          while IFS= read -r asset; do
            filename=$(basename "$asset")
            stem="${filename%.webp}"

            case "$stem" in
              acute|arcane|balanced|bear|blast|bloodlust|butcher|cheetah|combative|destructive|eagle|energy|focus|gale|glory|healer|insight|mystic|overloaded|reaper|recovering|resolute|ruthless|sorcery|sturdy|swift|titanic|vigorous|wizard)
                continue
                ;;
            esac

            clean_name=$(printf '%s' "$stem" | sed -E 's/-[A-Za-z0-9_-]{8,}$//')
            curl -fsSL "https://afkstargazer.com$asset" -o "portraits/${clean_name}.webp"
          done < .stargazer/assets.txt

          find portraits -type f \( \
            -name 'acute.webp' -o \
            -name 'arcane.webp' -o \
            -name 'balanced.webp' -o \
            -name 'bear.webp' -o \
            -name 'blast.webp' -o \
            -name 'bloodlust.webp' -o \
            -name 'butcher.webp' -o \
            -name 'cheetah.webp' -o \
            -name 'combative.webp' -o \
            -name 'destructive.webp' -o \
            -name 'eagle.webp' -o \
            -name 'energy.webp' -o \
            -name 'focus.webp' -o \
            -name 'gale.webp' -o \
            -name 'glory.webp' -o \
            -name 'healer.webp' -o \
            -name 'insight.webp' -o \
            -name 'mystic.webp' -o \
            -name 'overloaded.webp' -o \
            -name 'reaper.webp' -o \
            -name 'recovering.webp' -o \
            -name 'resolute.webp' -o \
            -name 'ruthless.webp' -o \
            -name 'sorcery.webp' -o \
            -name 'sturdy.webp' -o \
            -name 'swift.webp' -o \
            -name 'titanic.webp' -o \
            -name 'vigorous.webp' -o \
            -name 'wizard.webp' \
          \) -delete

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A portraits

          if git diff --staged --quiet; then
            echo "No portrait changes."
          else
            git commit -m "Fix portrait naming and remove UI assets"
            git push
          fi

      - name: Clean temporary files
        if: always()
        run: rm -rf .stargazer
