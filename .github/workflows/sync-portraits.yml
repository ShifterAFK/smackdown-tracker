name: Sync AFK Journey portraits

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tracker
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download and extract Stargazer assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .stargazer portraits
          curl -fsSL https://afkstargazer.com/ -o .stargazer/index.html

          mapfile -t JS_FILES < <(grep -oE '/assets/[A-Za-z0-9._-]+\.js' .stargazer/index.html | sort -u || true)
          if [ "${#JS_FILES[@]}" -eq 0 ]; then
            echo "No JavaScript bundles found."
            exit 1
          fi

          for js in "${JS_FILES[@]}"; do
            curl -fsSL "https://afkstargazer.com$js" -o ".stargazer/$(basename "$js")"
          done

          grep -hoE '/assets/[A-Za-z0-9._-]+\.webp' .stargazer/*.js .stargazer/index.html |
            sort -u > .stargazer/assets.txt

          if [ ! -s .stargazer/assets.txt ]; then
            echo "No WebP assets found."
            exit 1
          fi

          # Extract hero IDs directly from the tracker catalog.
          grep -oE '"?id"?[[:space:]]*:[[:space:]]*"[a-z0-9_-]+"' index.html |
            sed -E 's/.*"([a-z0-9_-]+)"$/\1/' |
            sort -u > hero_ids.txt

          if [ ! -s hero_ids.txt ]; then
            echo "No hero IDs found in index.html."
            exit 1
          fi

          while IFS= read -r asset; do
            filename=$(basename "$asset")
            stem="${filename%.webp}"

            clean=$(printf '%s' "$stem" | sed -E \
              -e 's/-(skin[0-9]+)-[A-Za-z0-9_-]+$/-\1/' \
              -e 't' \
              -e 's/-[A-Za-z0-9_-]+$//')

            base="$clean"
            if [[ "$clean" =~ -skin[0-9]+$ ]]; then
              base="${clean%-*}"
            fi

            if grep -Fxq "$base" hero_ids.txt; then
              curl -fsSL "https://afkstargazer.com$asset" -o "portraits/${clean}.webp"
            fi
          done < .stargazer/assets.txt

          # Remove anything that is not a tracker hero portrait or skin.
          shopt -s nullglob
          for file in portraits/*.webp; do
            name="$(basename "$file" .webp)"
            base="$name"
            if [[ "$name" =~ -skin[0-9]+$ ]]; then
              base="${name%-*}"
            fi

            if ! grep -Fxq "$base" hero_ids.txt; then
              rm -f "$file"
            fi
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A portraits

          if git diff --staged --quiet; then
            echo "No portrait changes."
          else
            git commit -m "Sync portraits using tracker hero allowlist"
            git push
          fi

      - name: Clean temporary files
        if: always()
        shell: bash
        run: rm -rf .stargazer hero_ids.txt
