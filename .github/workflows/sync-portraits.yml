name: Sync AFK Journey portraits

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tracker
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download and extract Stargazer assets
        run: |
          mkdir -p .stargazer
          curl -fsSL https://afkstargazer.com/ -o .stargazer/index.html

          JS_FILES=$(grep -oE '/assets/[A-Za-z0-9._-]+\.js' .stargazer/index.html | sort -u || true)
          if [ -z "$JS_FILES" ]; then
            echo "No JavaScript bundles found."
            exit 1
          fi

          for js in $JS_FILES; do
            curl -fsSL "https://afkstargazer.com$js" -o ".stargazer/$(basename "$js")"
          done

          grep -hoE '/assets/[A-Za-z0-9._-]+\.webp' .stargazer/*.js .stargazer/index.html |
            sort -u > .stargazer/assets.txt

          if [ ! -s .stargazer/assets.txt ]; then
            echo "No WebP assets found."
            exit 1
          fi

          mkdir -p portraits

          while IFS= read -r asset; do
            filename=$(basename "$asset")
            stem="${filename%.webp}"

            case "$stem" in
              bg-*|class-*|faction-*|level-*|damage-*|initial-energy-*|awakening-*|wedge-of-*|synergy-*|karma-*|soulbound-*|soulshock-*|enlightening-*|healwind-*|ironwall-*|hurricane-*|blazing-*|bladestorm-*|bladesummon-*|candleflame-*|confining-*|coreforge-*|crystal-beetle-*|lamentis-*|marene-*|meteorfall-*|orion-*|peggy-*|plague-creeper-*|rolan-*|seralyth-*|starshard-*|taichi-agumon-*|thane-*|thundermight-*|tidesurge-*|voracia-*|yamato-gabumon-*|zanie-turret-*|phraesto-shadow-*|elijah-lailah-elijah-*|elijah-lailah-lailah-*)
                continue
                ;;
            esac

            clean_name=$(printf '%s' "$stem" | sed -E 's/-[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$//; s/-[A-Za-z0-9_-]{6,}$//')
            curl -fsSL "https://afkstargazer.com$asset" -o "portraits/${clean_name}.webp"
          done < .stargazer/assets.txt

          find portraits -type f -regextype posix-extended \
            -regex '.*/[^/]+-[A-Za-z0-9_-]{6,}\.webp' \
            ! -regex '.*/[^/]+-skin[0-9]+\.webp' \
            -delete

          find portraits -type f \( \
            -name 'bg-*' -o \
            -name 'class-*' -o \
            -name 'faction-*' -o \
            -name 'level-*' -o \
            -name 'damage-*' -o \
            -name 'initial-energy-*' -o \
            -name 'awakening-*' -o \
            -name 'wedge-of-*' -o \
            -name 'synergy-*' -o \
            -name 'karma-*' -o \
            -name 'soulbound-*' -o \
            -name 'soulshock-*' -o \
            -name 'enlightening-*' -o \
            -name 'healwind-*' -o \
            -name 'ironwall-*' -o \
            -name 'hurricane-*' -o \
            -name 'blazing-*' -o \
            -name 'bladestorm-*' -o \
            -name 'bladesummon-*' -o \
            -name 'candleflame-*' -o \
            -name 'confining-*' -o \
            -name 'coreforge-*' -o \
            -name 'crystal-beetle-*' -o \
            -name 'lamentis-*' -o \
            -name 'marene-*' -o \
            -name 'meteorfall-*' -o \
            -name 'orion-*' -o \
            -name 'peggy-*' -o \
            -name 'plague-creeper-*' -o \
            -name 'rolan-*' -o \
            -name 'seralyth-*' -o \
            -name 'starshard-*' -o \
            -name 'taichi-agumon-*' -o \
            -name 'thane-*' -o \
            -name 'thundermight-*' -o \
            -name 'tidesurge-*' -o \
            -name 'voracia-*' -o \
            -name 'yamato-gabumon-*' -o \
            -name 'zanie-turret-*' -o \
            -name 'phraesto-shadow-*' -o \
            -name 'elijah-lailah-elijah-*' -o \
            -name 'elijah-lailah-lailah-*' \
          \) -delete

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A portraits

          if git diff --staged --quiet; then
            echo "No portrait changes."
          else
            git commit -m "Clean duplicate portraits and UI assets"
            git push
          fi

      - name: Clean temporary files
        if: always()
        run: rm -rf .stargazer
