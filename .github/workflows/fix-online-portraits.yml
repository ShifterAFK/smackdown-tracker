name: Use local portraits for online catalog heroes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-online-portraits:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tracker
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize online catalog portrait URLs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('assets/js/tracker-app.js')
          source = path.read_text(encoding='utf-8')

          helper = """function localPortraitUrl(hero){const id=slug(hero?.id||hero?.name||'');if(!id)return hero?.portrait_url||'';return BASE+(PORTRAIT_ALIASES[id]||id)+'.webp'}\n"""
          marker = "function portrait(h){"

          if 'function localPortraitUrl(hero)' in source:
              raise SystemExit('localPortraitUrl already exists.')
          if marker not in source:
              raise SystemExit('Could not find portrait function insertion point.')

          updated = source.replace(marker, helper + marker, 1)

          old_mapping = "config={...data,heroes:data.heroes.map(h=>({...h,is_allowed:h.is_allowed===true&&!isBannedHero(h)}))};"
          new_mapping = "config={...data,heroes:data.heroes.map(h=>({...h,portrait_url:localPortraitUrl(h),is_allowed:h.is_allowed===true&&!isBannedHero(h)}))};"

          if old_mapping not in updated:
              raise SystemExit('Expected loadConfig hero mapping was not found.')

          updated = updated.replace(old_mapping, new_mapping, 1)

          if updated == source:
              raise SystemExit('No loadConfig changes were applied.')

          path.write_text(updated, encoding='utf-8')
          print('Online catalog heroes now use local WebP portraits.')
          PY

      - name: Commit online portrait fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/tracker-app.js

          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Use local portraits for online catalog heroes"
            git push
          fi
