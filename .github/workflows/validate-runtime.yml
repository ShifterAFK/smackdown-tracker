name: Validate tracker runtime

on:
  push:
    branches:
      - development
    paths:
      - "index.html"
      - "assets/js/**"
      - "assets/css/**"
      - "scripts/validate-runtime.py"
      - ".github/workflows/validate-runtime.yml"
  pull_request:
    branches:
      - development
    paths:
      - "index.html"
      - "assets/js/**"
      - "assets/css/**"
      - "scripts/validate-runtime.py"
      - ".github/workflows/validate-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate entrypoint assets and JavaScript syntax
        run: python scripts/validate-runtime.py
